<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>How Well Does She Know Him? 💍</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;700&display=swap');

    :root {
      --red: #C8102E;
      --deep-red: #9B0C22;
      --pink: #FFB6C1;
      --light-pink: #FFE4EA;
      --blush: #FFF0F3;
      --white: #FFFFFF;
      --dark: #2D1A1F;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--blush);
      min-height: 100vh;
      overflow: hidden;
    }

    /* ─── SCREENS ─── */
    .screen {
      display: none;
      position: fixed;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      animation: fadeIn 0.5s ease;
    }
    .screen.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── BACKGROUND DECORATIONS ─── */
    .bg-decoration {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .bg-decoration::before,
    .bg-decoration::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      opacity: 0.12;
    }
    .bg-decoration::before {
      width: 600px; height: 600px;
      background: var(--red);
      top: -200px; right: -150px;
    }
    .bg-decoration::after {
      width: 500px; height: 500px;
      background: var(--pink);
      bottom: -150px; left: -100px;
    }

    .content { position: relative; z-index: 1; width: 100%; max-width: 900px; text-align: center; }

    /* ─── TITLE SCREEN ─── */
    #screen-title { background: linear-gradient(135deg, var(--deep-red) 0%, var(--red) 50%, #E8294A 100%); }

    .title-roses {
      font-size: 3rem;
      margin-bottom: 12px;
      letter-spacing: 8px;
    }

    .title-main {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      font-weight: 900;
      color: var(--white);
      line-height: 1.05;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
      margin-bottom: 8px;
    }

    .title-subtitle {
      font-family: 'Lato', sans-serif;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      font-weight: 300;
      color: rgba(255,255,255,0.85);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .title-names {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      font-weight: 700;
      color: var(--pink);
      margin-bottom: 50px;
    }

    .nashville-badge {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: var(--white);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 8px 24px;
      border-radius: 30px;
      margin-bottom: 50px;
    }

    /* ─── BUTTONS ─── */
    .btn {
      display: inline-block;
      cursor: pointer;
      border: none;
      border-radius: 60px;
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.25s ease;
      user-select: none;
    }

    .btn-primary {
      background: var(--white);
      color: var(--red);
      font-size: 1.1rem;
      padding: 18px 56px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 14px 40px rgba(0,0,0,0.3); }
    .btn-primary:active { transform: translateY(0); }

    .btn-red {
      background: var(--red);
      color: var(--white);
      font-size: 1.1rem;
      padding: 18px 56px;
      box-shadow: 0 8px 30px rgba(200,16,46,0.4);
    }
    .btn-red:hover { background: var(--deep-red); transform: translateY(-3px); box-shadow: 0 14px 40px rgba(200,16,46,0.5); }
    .btn-red:active { transform: translateY(0); }

    .btn-outline {
      background: transparent;
      color: var(--red);
      border: 2px solid var(--red);
      font-size: 1rem;
      padding: 14px 40px;
    }
    .btn-outline:hover { background: var(--red); color: var(--white); transform: translateY(-2px); }

    .btn-ghost {
      background: rgba(255,255,255,0.15);
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.4);
      font-size: 0.9rem;
      padding: 12px 32px;
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.25); transform: translateY(-2px); }

    /* ─── QUESTION SCREEN ─── */
    #screen-question { background: var(--blush); }

    .progress-bar-wrap {
      width: 100%;
      max-width: 700px;
      height: 6px;
      background: rgba(200,16,46,0.15);
      border-radius: 10px;
      margin-bottom: 14px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--red), var(--pink));
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .q-counter {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 32px;
    }

    .q-card {
      background: var(--white);
      border-radius: 28px;
      padding: 60px 56px;
      box-shadow: 0 20px 60px rgba(200,16,46,0.1), 0 4px 20px rgba(0,0,0,0.05);
      margin-bottom: 40px;
      width: 100%;
      max-width: 760px;
      position: relative;
      overflow: hidden;
    }
    .q-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--red), var(--pink));
    }

    .q-label {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 20px;
    }

    .q-text {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 700;
      color: var(--dark);
      line-height: 1.3;
    }

    .q-hint {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #999;
      font-style: italic;
    }

    /* ─── REVEAL SCREEN ─── */
    #screen-reveal { background: linear-gradient(160deg, var(--dark) 0%, #3D1A24 100%); }

    .reveal-label {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--pink);
      margin-bottom: 16px;
    }

    .reveal-q {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.1rem, 2.5vw, 1.6rem);
      font-weight: 400;
      color: rgba(255,255,255,0.7);
      margin-bottom: 28px;
      font-style: italic;
    }

    .video-container {
      position: relative;
      width: 100%;
      max-width: 340px;
      margin: 0 auto 32px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 3px var(--pink);
      background: #000;
    }

    .video-container video {
      width: 100%;
      display: block;
      aspect-ratio: 9 / 16;
      object-fit: contain;
      background: #000;
    }

    /* ─── FINAL SCREEN ─── */
    #screen-final { background: linear-gradient(135deg, var(--deep-red) 0%, var(--red) 50%, #E8294A 100%); }

    .final-emoji { font-size: 4rem; margin-bottom: 16px; }

    .final-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 900;
      color: var(--white);
      line-height: 1.1;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
      margin-bottom: 16px;
    }

    .final-names {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4rem, 3.5vw, 2.2rem);
      color: var(--pink);
      margin-bottom: 24px;
    }

    .final-sub {
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.75);
      margin-bottom: 50px;
    }

    /* ─── DIVIDER ─── */
    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--red), var(--pink));
      border-radius: 2px;
      margin: 0 auto 28px;
    }

    /* ─── NAV ROW ─── */
    .nav-row {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

<div class="bg-decoration"></div>

<!-- ══════════════════════════════════════════
     TITLE SCREEN
══════════════════════════════════════════ -->
<div id="screen-title" class="screen active">
  <div class="content">
    <div class="title-roses">🌹 🥂 🌹</div>
    <div class="title-subtitle">Ellese's Bachelorette</div>
    <div class="title-main">How Well Does<br>She Know Him?</div>
    <div class="divider" style="background: rgba(255,182,193,0.6); margin: 20px auto 20px;"></div>
    <div class="title-names">Ellese &amp; Jake</div>
    <div class="nashville-badge">🎸 Last Night in Nashville 🎸</div>
    <br>
    <button class="btn btn-primary" onclick="startGame()">Let's Play!</button>
  </div>
</div>

<!-- ══════════════════════════════════════════
     QUESTION SCREEN
══════════════════════════════════════════ -->
<div id="screen-question" class="screen">
  <div class="content">
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
    </div>
    <div class="q-counter" id="q-counter">Question 1 of 14</div>

    <div class="q-card">
      <div class="q-label">The Question</div>
      <div class="q-text" id="q-text"></div>
      <div class="q-hint">Ellese answers out loud — then reveal Jake's answer!</div>
    </div>

    <button class="btn btn-red" onclick="showReveal()">▶ Play Jake's Answer</button>
  </div>
</div>

<!-- ══════════════════════════════════════════
     REVEAL SCREEN
══════════════════════════════════════════ -->
<div id="screen-reveal" class="screen">
  <div class="content">
    <div class="reveal-label">Jake's Answer 🎬</div>
    <div class="reveal-q" id="reveal-q-text"></div>

    <div class="video-container">
      <video id="game-video" controls playsinline>
        <source id="video-src" src="" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
    </div>

    <div class="nav-row">
      <button class="btn btn-ghost" onclick="showQuestion()">← Back</button>
      <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">Next Question →</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     FINAL SCREEN
══════════════════════════════════════════ -->
<div id="screen-final" class="screen">
  <div class="content">
    <div class="final-emoji">💍</div>
    <div class="final-title">That's a Wrap!</div>
    <div class="divider" style="background: rgba(255,182,193,0.5); margin: 16px auto 20px;"></div>
    <div class="final-names">Here's to Ellese &amp; Jake!</div>
    <div class="final-sub">🥂 Last Night in Nashville 🎸</div>
    <button class="btn btn-primary" onclick="restartGame()">Play Again</button>
  </div>
</div>

<script>
  const questions = [
    { q: "Where do you see you and Jake in five years?",                      video: "IMG_3010.MOV" },
    { q: "What is Ellese's weirdest habit?",                                  video: "IMG_3018.MOV" },
    { q: "What is Jake's go-to apology?",                                     video: "IMG_3023.MOV" },
    { q: "What are you most excited for in married life?",                    video: "IMG_3033.MOV" },
    { q: "What would Jake say Ellese is not good at?",                        video: "IMG_3012.MOV" },
    { q: "Who is more likely to win an argument?",                            video: "IMG_3007.MOV" },
    { q: "What is something Ellese does that drives you crazy (in a loving way)?", video: "IMG_3008.MOV" },
    { q: "What is Ellese's most worn outfit at home?",                        video: "IMG_3009.MOV" },
    { q: "What is Jake's favorite memory with Ellese?",                       video: "IMG_3022.MOV" },
    { q: "What is Ellese's favorite color?",                                  video: "IMG_3002.MOV" },
    { q: "What is Jake's most annoying habit?",                               video: "IMG_3004.MOV" },
    { q: "Who made the first move?",                                          video: "IMG_2998.MOV" },
    { q: "Something Ellese is good at?",                                      video: "IMG_3003.MOV" },
    { q: "Who said I love you first?",                                        video: "IMG_3001.MOV" },
  ];

  let current = 0;

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function startGame() {
    current = 0;
    loadQuestion();
    show('screen-question');
  }

  function loadQuestion() {
    const total = questions.length;
    const pct = (current / total) * 100;

    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('q-counter').textContent = `Question ${current + 1} of ${total}`;
    document.getElementById('q-text').textContent = questions[current].q;
  }

  function showReveal() {
    const { q, video } = questions[current];

    document.getElementById('reveal-q-text').textContent = `"${q}"`;

    const videoEl = document.getElementById('game-video');
    const srcEl   = document.getElementById('video-src');

    // Pause any playing video
    videoEl.pause();
    srcEl.src = video;
    // Try mp4 first; browsers often accept MOV fine
    srcEl.type = video.toLowerCase().endsWith('.mov') ? 'video/quicktime' : 'video/mp4';
    videoEl.load();
    videoEl.play().catch(() => {}); // autoplay may be blocked — user can tap play

    const isLast = current === questions.length - 1;
    document.getElementById('next-btn').textContent = isLast ? 'See Finale 🎉' : 'Next Question →';

    show('screen-reveal');
  }

  function showQuestion() {
    const videoEl = document.getElementById('game-video');
    videoEl.pause();
    loadQuestion();
    show('screen-question');
  }

  function nextQuestion() {
    const videoEl = document.getElementById('game-video');
    videoEl.pause();

    if (current < questions.length - 1) {
      current++;
      loadQuestion();
      show('screen-question');
    } else {
      show('screen-final');
    }
  }

  function restartGame() {
    startGame();
  }
</script>
</body>
</html>
